# Data sweep (issue #14): discovers data/* branches pushed by the fetch host,
# opens a PR for each, and enables auto-merge for data-only changes.
#
# Scope note: this watches only `data/*`. Maintainer-driven bulk ingestion
# (e.g. FOI batches) bundles converter code + regenerated golden masters and so
# can never be "data-only"; it uses the `ingest/*` branch prefix instead, which
# this sweep deliberately ignores, and lands via its own reviewed consolidation
# PRs (regenerate the golden set with `npm run regen`).
#
# Security shape (ADR 0001): this workflow runs only reviewed code from main on
# a schedule - never in response to a push - so branch content can influence
# WHAT gets merged only through the path allowlist below, never what executes.
# The fetch host's deploy key can push branches but cannot touch main; this
# workflow's per-run token is the only automated credential that can, and only
# via merging PRs whose diff is confined to data paths.
name: Data sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # issues: write is solely for the rolling data-landings digest comment
  # (Option A visibility, #583/#588) - the digest is the one additive,
  # ADR 0009-compatible notification this workflow posts.
  issues: write

concurrency:
  group: data-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Open PRs for data branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/data/*:refs/remotes/origin/data/*' || true

          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/data/*'); do
            branch="${ref#origin/}"

            # Fully merged (or empty) branches are leftovers - clean them up.
            if [ -z "$(git rev-list "origin/main..$ref" -- 2>/dev/null)" ]; then
              echo "::notice::$branch is fully merged into main; deleting."
              git push origin --delete "$branch" || true
              continue
            fi

            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              echo "PR already open for $branch."
              continue
            fi

            # Allowlist mirrors the paths gitCommitAndPush stages (and the
            # archive tree). Anything outside it means the branch is not a
            # pure data publication and must not auto-merge.
            changed="$(git diff --name-only "origin/main...$ref")"
            echo "Changes on $branch:"
            echo "$changed"
            data_only=true
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              case "$p" in
                archive/*) ;;
                latest-raw.csv|latest-raw-sorted.csv|latest.json|latest-raw-sorted.json|latest-meta.json) ;;
                amateur-callsigns-raw.csv|metadata-download-info.json) ;;
                *) data_only=false ;;
              esac
            done <<< "$changed"

            title="$(git log -1 --format=%s "$ref")"
            pr_url="$(gh pr create --head "$branch" --base main \
              --title "$title" \
              --body "Automated data publication (branch \`$branch\`), opened by the scheduled data sweep. Merge method is merge-commit so the fetcher's per-publication commit messages are preserved on main.")"
            echo "Opened $pr_url"

            if [ "$data_only" = true ]; then
              # --auto waits for required checks (tests + data-validation are
              # required contexts). If enabling auto-merge fails for ANY
              # reason, fail closed and loudly: a direct-merge fallback would
              # bypass still-pending checks, which is worse than a stalled PR.
              if ! gh pr merge --auto --merge --delete-branch "$pr_url"; then
                gh pr comment "$pr_url" --body "Auto-merge could not be enabled - this data PR is parked for attention rather than merged past its checks."
                exit 1
              fi

              # Option A visibility (#583, conditional on #588 part 2): the PR
              # still lands unattended, but a landing must never go unseen.
              # Two additive, ADR 0009-compatible signals - nothing here
              # touches the merge decision itself:
              #   1. the assignee mechanism, so the PR surfaces for a
              #      post-hoc look even though it already merged;
              #   2. one line on a rolling "data landings" digest issue, so
              #      every landing has a durable, chronological record.
              # The digest reuses the same search-title / edit-or-create
              # upsert reports-sweep.yml already uses for its rolling coverage
              # dashboard, but APPENDS a comment per
              # landing instead of replacing the issue body: a running log
              # reads naturally as comments, and it needs no read-modify-write
              # of prior entries (the workflow's own `concurrency` group
              # already serialises sweep runs, so no race is possible either
              # way).
              assignee="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.login)"
              gh pr edit "$pr_url" --add-assignee "$assignee" || echo "::warning::Could not assign $pr_url to $assignee - landing still recorded on the digest."

              digest_title="Data landings (rolling digest)"
              digest_number="$(gh issue list --state open --search "in:title \"$digest_title\"" --json number,title --jq ".[] | select(.title == \"$digest_title\") | .number" | head -1)"
              if [ -z "$digest_number" ]; then
                digest_url="$(gh issue create --title "$digest_title" \
                  --body "Maintained automatically by the data-sweep workflow - do not edit the issue body by hand. Each comment below records one auto-merged data-only landing, newest last.")"
                digest_number="${digest_url##*/}"
              fi
              gh issue comment "$digest_number" --body "$(date -u +%Y-%m-%dT%H:%M:%SZ) - $pr_url (\`$branch\`) - data-only diff, auto-merge enabled (merges once required checks are green)."
            else
              gh pr comment "$pr_url" --body "Diff touches non-data paths - auto-merge NOT enabled. This needs human review."
            fi
          done
