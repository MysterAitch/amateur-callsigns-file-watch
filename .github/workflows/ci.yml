# Read-only CI (issue #15): gates every PR with tests, typecheck, and
# data-integrity validation. Zero write scopes - this workflow exists to make
# auto-merge (see data-sweep.yml and ADR 0002) genuinely conditional on green,
# and to catch breakage before it lands on main.
#
# The two job names below (tests, data-validation) are required status checks
# in the main ruleset - renaming a job here without updating the ruleset will
# block all merges.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:coverage

  # Workflow hygiene auditors. Not required status checks (they gate the
  # workflows, not the data), but red runs demand attention:
  # - actionlint: syntax + shellcheck on the bash embedded in run: blocks -
  #   the security-critical orchestration (data-sweep, normalise) lives there.
  # - zizmor: security audit of workflow patterns (pwn-requests, credential
  #   handling, unpinned actions).
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.26.1 2>/dev/null || pip install --user zizmor==1.26.1
          zizmor --format plain .github/workflows/

  data-validation:
    name: data-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate archive entries and latest-* pointers
        run: |
          set -euo pipefail
          # Structural + byte-integrity checks run over ALL archive entries;
          # expensive deep CSV parsing runs only on entries this PR touches
          # (or the newest entry, on pushes to main).
          keys=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            keys="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- 'archive/' | cut -d/ -f2 | sort -u)"
          fi
          # shellcheck disable=SC2086 # archive keys are date-shaped, never contain spaces
          npx tsx src/ci/validate-data.ts $keys
