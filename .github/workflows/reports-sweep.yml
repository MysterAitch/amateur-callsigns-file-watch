# Report sweep (ADR 0001's PR-gated writeback lane, converted by #446): daily
# cron regenerates the committed standing reports under reports/ from the
# ledger projection and the claim-ledger folds. Byte-identical output is a
# no-op; any change (a new publication gaining its reports column, fold/render
# evolution) becomes a PR whose cross-report diff is the review artefact -
# report PRs are ALWAYS human-reviewed, never auto-merged.
#
# The DERIVATION half this workflow once carried (re-deriving each entry's
# committed normalised.csv/components.csv/stats.json via the source
# converters) is retired (#446): the committed derivatives are a FROZEN
# equivalence baseline, and every consumer reads derived views through the
# archive/projection switch - a new publication's derived views exist only in
# the ledger projection, built below and proven byte-identical to the
# committed baseline by the full-corpus parity gate.
#
# Coverage (per-entry derived-view state, incl. failures and raw-only entries)
# is maintained on a single rolling issue, dashboard-style. Any entry failure
# also turns this run red so it re-alarms until fixed.
name: Report sweep

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # actions:write solely to dispatch cicd.yaml onto the reports branch:
  # pull_request runs from github-actions[bot]-authored PRs park in
  # action_required under the repository's contributor-approval policy, but
  # workflow_dispatch runs are not subject to that gate - and required
  # status checks match by check name regardless of triggering event.
  actions: write

concurrency:
  group: report-sweep
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      # No persisted credentials: npm ci and the folds run third-party code,
      # which must never execute with a write-capable token sitting in
      # .git/config. The push step below injects the token explicitly (Actions
      # masks it in logs), so the write credential exists only where writing
      # happens.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The report folds (value catalogue, cross-dataset invariants, the
      # quality reports) run via DuckDB (issue #361). Pinned static binary, no
      # native npm build (ADR 0002).
      - uses: ./.github/actions/setup-duckdb

      # Build the shared claim-ledger Parquet ONCE (issue #403). Every report
      # folded from the ledger reads this single artefact via CLAIMS_PARQUET
      # below, instead of each re-materialising the multi-GB ledger. Built
      # here, not committed: a build-time intermediate that lives only for
      # this run.
      - name: Build shared claim-ledger Parquet
        run: node src/v2/build-ledger-db.ts "$RUNNER_TEMP/claims.parquet" --parquet-only

      # The builder-facing ledger projection (issue #629): the per-entry
      # derived views (normalised.csv, components.csv, stats.json) the report
      # lane reads through BUILDER_PROJECTION_DIR - so a publication newer
      # than the frozen committed baseline contributes to the reports the
      # moment it lands, with no derivation step in between. The same
      # projection build the deploy and the golden-master gate run.
      - name: Build builder projection
        run: node src/v2/build-builder-projection.ts "$RUNNER_TEMP/builder-projection"

      # The FOI lane has no scheduled step (#447): its derivation
      # verification runs as a CI test on every pull request and push
      # (foi-verification.test.ts, whole lane, byte-identity) - a tighter
      # cadence than a daily cron for bytes that can only change via a merge.
      - name: Run report sweep
        id: sweep
        env:
          # The sweep writes its coverage section even when entries fail; a
          # missing file means it crashed before reporting, so the steps
          # below refuse to PR from (or publish) unaccounted state.
          COVERAGE_MARKDOWN_FILE: /tmp/coverage.md
          CLAIMS_PARQUET: ${{ runner.temp }}/claims.parquet
          BUILDER_PROJECTION_DIR: ${{ runner.temp }}/builder-projection
        run: |
          set +e
          npm run reports:sweep
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Open PR for changed reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A missing coverage report means the sweep crashed before
          # reporting (distinct from per-entry failures, which still produce
          # one): whatever is in the working tree is unaccounted for, so do
          # NOT commit or push it - the final step turns the run red.
          if [ ! -f /tmp/coverage.md ]; then
            echo "::error::Sweep produced no coverage report - refusing to open a PR from unaccounted working-tree state."
            exit 0
          fi
          # Reports are the ONLY writeback this lane owns (#446): the
          # committed archive derivatives are frozen, so nothing here may
          # stage archive/ or the latest-* pointers.
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="reports/run-${{ github.run_id }}"
          git checkout -b "$branch"
          git add reports/
          git commit -m "Report sweep: regenerate standing reports"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          {
            echo "Scheduled report sweep output. The cross-report diff below is the review artefact - check that changes are expected (a new publication gaining its reports column, or a deliberate fold/render change) before merging."
            echo ""
            cat /tmp/coverage.md
          } > /tmp/pr-body.md
          gh pr create --head "$branch" --base main \
            --title "Report sweep: standing reports update" \
            --body-file /tmp/pr-body.md
          # The pull_request-triggered CI run for a bot-authored PR parks in
          # action_required (contributor-approval policy). Dispatch CI onto
          # the branch explicitly: workflow_dispatch is exempt from that
          # gate, and the ruleset's required checks match by name whatever
          # event produced them.
          gh workflow run cicd.yaml --ref "$branch"

      - name: Update rolling coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/coverage.md ]; then
            echo "Sweep produced no coverage report - leaving the dashboard at its last known state."
            exit 0
          fi
          title="Normalisation coverage (rolling dashboard)"
          {
            echo "Maintained automatically by the report-sweep workflow - do not edit by hand; comments welcome."
            echo ""
            cat /tmp/coverage.md
          } > /tmp/issue-body.md
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$title" --body-file /tmp/issue-body.md
          fi

      - name: Fail run if any entry failed
        env:
          SWEEP_EXITCODE: ${{ steps.sweep.outputs.exitcode }}
        run: |
          if [ "$SWEEP_EXITCODE" != "0" ]; then
            echo "::error::One or more entries failed to report - see the sweep step logs and the coverage issue."
            exit 1
          fi
