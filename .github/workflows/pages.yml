# GitHub Pages deploy (ADR 0003): builds the published SQLite database and
# the static lookup site as a DEPLOY ARTEFACT on every push to main.
#
# The database is deliberately never committed - SQLite files are not
# byte-deterministic, so it lives outside the golden-master lane and is
# derived fresh from committed data (archive/ + reference-data/) each deploy.
#
# Write posture: no repository writeback whatsoever. The deploy job's only
# permissions are the Pages deployment itself (pages + id-token), consistent
# with the repository's supply-chain stance (see ADR 0002/0003).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Build site with SQLite database
        run: |
          mkdir -p _site/data _site/vendor
          # .png extension: GitHub Pages gzip-transcodes text-like content
          # types INCLUDING their Range responses (byte ranges of the
          # compressed representation - verified live), which corrupts
          # sql.js-httpvfs reads. Image types are never re-compressed, so
          # the plain-SQLite file wears a .png name. See site/app.js.
          # --tiers additionally builds the master database (all datasets +
          # the FOI observations union), one database per archive entry, and
          # the gzipped flat union CSV (issue #149 item 4).
          node src/ci/build-sqlite.ts _site/data/callsigns.sqlite.png --tiers
          # The raw-keyed claim-ledger database (issue #361, Stage 3a): the
          # deploy-time artefact the Ledger page queries in the browser over the
          # same range-request VFS, in the same .png costume as the databases
          # above. The COMPACT build (ADR-tracked spike #368) folds the FULL
          # corpus - every archived register-snapshot publication - into a
          # range-served SQLite by splitting provenance onto an observation row and
          # reconstructing the derived layer through a `claims` VIEW. Never
          # committed (SQLite is not byte-deterministic), derived fresh here.
          node src/v2/build-ledger-db-compact.ts _site/data/claim-ledger.sqlite.png
          # Serve it CHUNKED, not as one file (issue #475). A HEAD of a large object
          # on GitHub Pages negotiates a compressed variant (Vary: Accept-Encoding)
          # that is a persistent CDN cache MISS, stalling the in-browser open ~30s.
          # sql.js-httpvfs chunked mode takes the length from a manifest (no HEAD)
          # and range-reads WITHIN fixed-size chunk files (identity encoding, fast).
          # serverChunkSize only sets the file count; reads stay 4 KB page ranges.
          # 90 MiB keeps each part under the Pages 100 MB/file limit and the count
          # low (~16 for the current corpus; a `cat …png.* > db` reassembles it).
          server_chunk=94371840   # 90 MiB, a multiple of the 4096 page size
          db_len=$(stat -c%s _site/data/claim-ledger.sqlite.png)
          split -b "$server_chunk" -d -a 3 _site/data/claim-ledger.sqlite.png _site/data/claim-ledger.sqlite.png.
          printf '{"databaseLengthBytes":%s,"serverChunkSize":%s,"suffixLength":3}\n' "$db_len" "$server_chunk" > _site/data/claim-ledger.chunks.json
          # Drop the monolith (query lane now reads the chunks) and its gzip twin,
          # so the site carries the chunks only, not both.
          rm -f _site/data/claim-ledger.sqlite.png _site/data/claim-ledger.sqlite.gz
          # Version stamp: the app appends ?v=<sha> to the database URL so
          # each deploy is a distinct CDN cache object - two deploys inside
          # the Pages max-age window otherwise mix range chunks from
          # different database versions (observed live: "database disk
          # image is malformed"). See site/app.js.
          printf '%s' "$GITHUB_SHA" > _site/data/version.txt
          # Deploy provenance for page footers: the commit's own timestamp
          # and this build's time (the GitHub Actions run id/number/url come
          # from the standard GITHUB_* env vars the generator reads). Declare
          # then export separately so the command's exit status isn't masked
          # by the export (shellcheck SC2155).
          BUILD_COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_COMMIT_TIME BUILD_TIME
          # Dataset index (issue #149 item 3): per-entry pages publishing
          # the archived files verbatim at stable URLs + Frictionless
          # descriptors + sitemap.xml - the Wayback Machine crawl seed.
          node src/ci/build-dataset-pages.ts _site
          # Copy every hand-authored site asset by glob rather than a
          # hand-listed set: a module added later (and imported by app.js et al)
          # is deployed automatically, so a missing import can no longer break
          # the live pages. The site-deploy-coverage test guards this contract.
          cp site/*.html site/*.js site/*.css site/*.webmanifest _site/
          # Version-stamp the service worker (ADR 0008). The browser re-installs
          # a worker only when its script bytes change, so writing the commit
          # SHA into DEPLOY_VERSION makes each deploy supersede the last: it
          # names the shell cache by the commit and lets the activate handler
          # drop the previous caches. Same rationale as the database ?v= stamp
          # above; without it a cached shell could make the site un-updatable.
          sed -i "s/const DEPLOY_VERSION = 'dev';/const DEPLOY_VERSION = '$GITHUB_SHA';/" _site/sw.js
          # The statistics page's aggregates (locator matrix, flags table)
          # are deterministic per deploy - pre-rendered so the page is
          # fully static (no scripts; archived captures are complete).
          node src/ci/build-home-aggregates.ts _site/statistics.html
          # The /data-status coverage tracker (issue #376): the dataset ×
          # processing-stage grid, per-type rollup, known-but-absent work-queue
          # and series/gap view - all derived here from the committed archive
          # and the source register, never hand-maintained.
          node src/ci/build-data-status.ts _site/data-status.html
          # Stamp the canonical nav strip (the single source, navHtml in
          # site-render.ts) into every hand-authored page, so the deployed
          # pages carry the full nav - Inter-dataset link, Forbidden suffixes -
          # without a hand-maintained second copy that drifts (issue #308).
          node src/ci/build-nav.ts _site/index.html _site/statistics.html _site/explore.html _site/compare.html _site/ledger.html _site/playground.html _site/data-status.html _site/glossary.html _site/about.html
          # sql.js-httpvfs is served from the npm-audited package, vendored at
          # build time - no CDN scripts, nothing committed. The sourcemap is
          # included so browser devtools stop 404ing for it.
          cp node_modules/sql.js-httpvfs/dist/index.js \
             node_modules/sql.js-httpvfs/dist/index.js.map \
             node_modules/sql.js-httpvfs/dist/sqlite.worker.js \
             node_modules/sql.js-httpvfs/dist/sql-wasm.wasm \
             _site/vendor/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
