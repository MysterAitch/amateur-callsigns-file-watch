# Label-triggered golden sweep (issue #581). When the read-only verify pipeline
# (cicd.yaml, flag-golden-drift) finds the committed golden data-count figures
# under reports/ are stale, it adds the "needs data count update" label. This
# workflow reacts to that label: it regenerates reports/ through the pinned
# DuckDB CLI and commits the result back to the PR branch, so the figures land
# WITHOUT a contributor needing DuckDB locally.
#
# Posture: cicd.yaml stays entirely read-only (ADR 0012). This is a SEPARATE,
# explicitly label-triggered workflow with write scope - the same pattern as
# normalise.yml (regenerate -> commit to a branch -> re-dispatch cicd) and
# data-sweep.yml. It runs reviewed code from the PR branch of a SAME-REPO PR
# only; fork PRs (which get a read-only token) are skipped.
name: Sweep on label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  sweep:
    name: sweep
    # Only the trigger label, and only same-repo PRs (a fork PR's token cannot
    # push to the fork branch, and must never run write-scoped against head code).
    if: >-
      github.event.label.name == 'needs data count update'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit + push the regenerated reports/ to the PR branch
      pull-requests: write    # remove the trigger label once handled
      actions: write          # re-dispatch cicd.yaml to re-verify the new commit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-duckdb
      - name: Regenerate golden reports
        run: npm run normalise:sweep
      - name: Commit and push regenerated reports (if any changed)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/; then
            echo "No golden drift under reports/ - nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/
            git commit -m "chore(goldens): regenerate reports/ after a data-count change (#581)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          fi
      - name: Remove the trigger label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "needs data count update" || true
      - name: Re-dispatch verification on the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # A GITHUB_TOKEN push does not itself re-trigger pull_request checks, so
          # dispatch cicd.yaml explicitly onto the branch (workflow_dispatch is
          # exempt from that rule) to re-verify the regenerated tree - the same
          # re-dispatch normalise.yml performs.
          gh workflow run cicd.yaml --ref "${HEAD_REF}"
