# Unified CI/CD (issue #478, ADR 0019). One pipeline that both gates every PR
# (tests, typecheck, data-integrity validation) and, on main, builds and deploys
# the GitHub Pages site. Merging the two former workflows (ci.yml + pages.yml)
# lets the deploy share CI's content-addressed build-cache layout in one file,
# where the layer keys live once (ADR 0019); it also gives the deploy database
# build pre-merge coverage, since build-site-databases runs on PRs too (it just
# stops short of uploading the Pages artefact).
#
# The two job names below (tests, data-validation) are required status checks in
# the main ruleset - renaming a job here without updating the ruleset will block
# all merges. `golden-master` is a pending required-check candidate (#588 part
# 2, #583): it is a single, non-matrixed job, so its reported check context is
# the stable string "golden-master" - see that job's comment for the ruleset
# addition this enables.
#
# Write posture (ADR 0012): the workflow's default scope is contents:read. Only
# the deploy job elevates (pages:write + id-token:write), at the job level, so
# every verify job stays read-only and no repository writeback is possible. The
# deploy and post-deploy jobs are gated `if: github.ref == 'refs/heads/main'`,
# so PR runs execute build + verify and stop before deploying.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fan-out architecture (#478): build the shared claims Parquet ONCE, publish it
  # as a workflow artifact, and let every downstream test job pull it and run in
  # parallel - each heavy file in its own job, the ~78 trivial files sharded. tsc +
  # lint run as their own parallel job off the critical path. Wall-clock collapses
  # toward the single slowest file rather than the serial sum. The two expensive
  # builds - the claims Parquet and the SQLite tiers - are additionally cached by
  # input closure (actions/cache), so a PR that touches neither the committed data
  # nor the builder code skips them entirely and restores from cache (#478). Each test job emits
  # a coverage blob; the `coverage` job merges them so the coverage floor stays
  # enforced per-PR despite the split. The `tests` job aggregates all of these into
  # the single required status check the branch ruleset gates on.
  build-claims:
    name: build-claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Layered build cache (#478): the full-corpus claims Parquet (issue #403
      # buildClaimsParquet) is the one artefact every fold job reads via
      # CLAIMS_PARQUET. Cache it keyed by its input closure - the committed archive
      # + reference-data (the data) and the claim-emission code that shapes it.
      # Most PRs touch none of those, so the ~148s build (and the DuckDB setup it
      # needs) is skipped and the artefact is served from cache; a change to the
      # data or the emitter busts the key and rebuilds, which is exactly when the
      # Parquet can differ. Repo-scoped by key, so re-runs and sibling branches on
      # the same closure share the one build.
      # The cache key is the input closure's content hash with TEST FILES EXCLUDED
      # (see the closure-hash action): a data-assertion or any other test edit runs
      # against the restored build instead of busting it. .nvmrc + the pinned DuckDB
      # action are in the paths so a node/engine bump still rekeys.
      - id: closure
        uses: ./.github/actions/closure-hash
        with:
          paths: archive reference-data src/v2 src/sources src/shared package-lock.json .nvmrc .github/actions/setup-duckdb/action.yml
      - id: parquet-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: claims.parquet
          key: claims-parquet-v2-${{ steps.closure.outputs.hash }}
      - if: steps.parquet-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-duckdb
      - if: steps.parquet-cache.outputs.cache-hit != 'true'
        run: node src/v2/build-ledger-db.ts claims.parquet --parquet-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claims-parquet
          path: claims.parquet
          retention-days: 1

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Both tsc projects: the node-side src build (tsconfig.json) AND the browser
      # site + its tests (tsconfig.site.json, issue #464). noEmit is set in the
      # configs, so this is a pure type check.
      - run: npm run typecheck
      - run: npm run lint

  # Derive the heavy matrices from the single source of truth. heavy-tests.json
  # is the full set (also vitest's fast-pool exclude); fold-tests.json marks the
  # subset that reads the shared Parquet. The rest rebuild their own data and so
  # need not wait for build-claims - they run as heavy-nonfold, starting at t=0
  # (#478). Add/remove a heavy file in heavy-tests.json (and, if it's a Parquet
  # fold, fold-tests.json) and both matrices + the exclude follow.
  matrix-setup:
    name: matrix-setup
    runs-on: ubuntu-latest
    outputs:
      folds: ${{ steps.lists.outputs.folds }}
      nonfolds: ${{ steps.lists.outputs.nonfolds }}
      shardmatrix: ${{ steps.lists.outputs.shardmatrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lists
        run: |
          set -euo pipefail
          folds=$(jq -c . src/testing/fold-tests.json)
          # sharded-tests.json declares each too-expensive heavy file WITH its shard
          # count { file, shards }. shardmatrix expands that into one CI job per
          # (file, shard) - the SINGLE source of truth for both the file list and N,
          # so adding a source just makes each shard bigger and bumping "shards"
          # adds runners. The files come out of the non-fold pool.
          sharded_files=$(jq -c '[.[].file]' src/testing/sharded-tests.json)
          shardmatrix=$(jq -c '[.[] | .file as $f | .shards as $n | range(1; $n + 1) | {file: $f, shard: ., total: $n}]' src/testing/sharded-tests.json)
          # The tier build and the whole-archive ledger build each have their own
          # dedicated CACHED job (build-sqlite-tiers + build-ledger, #478), so both
          # leave the generic non-fold pool - they verify a cache-restored build
          # keyed by input closure rather than rebuilding in the matrix. A short
          # special-case list; promote to its own JSON file if it keeps growing.
          cached='["src/ci/build-sqlite.tiers.test.ts", "src/v2/build-ledger.test.ts"]'
          # non-folds = heavy set minus the Parquet folds, the sharded files and the cached builds.
          nonfolds=$(jq -cn --argjson all "$(jq -c . src/testing/heavy-tests.json)" --argjson f "$folds" --argjson s "$sharded_files" --argjson c "$cached" '$all - $f - $s - $c')
          {
            echo "folds=$folds"
            echo "nonfolds=$nonfolds"
            echo "shardmatrix=$shardmatrix"
          } >> "$GITHUB_OUTPUT"

  # The Parquet folds: read the shared artefact, so they wait for build-claims.
  heavy-fold:
    name: heavy-fold
    needs: [build-claims, matrix-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.matrix-setup.outputs.folds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-duckdb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claims-parquet
      # --coverage + blob per job; the `coverage` job merges them. Matrix values
      # go via env (zizmor template-injection); the blob is uniquely named.
      - run: npx vitest run "$HEAVY_FILE" --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/fold-${JOB_INDEX}.json"
        env:
          HEAVY_FILE: ${{ matrix.file }}
          JOB_INDEX: ${{ strategy.job-index }}
          CLAIMS_PARQUET: ${{ github.workspace }}/claims.parquet
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-fold-${{ strategy.job-index }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The rebuild tests: they materialise their own inputs and never read the
  # Parquet, so they DON'T need build-claims - they start as soon as matrix-setup
  # resolves (t=0), off the build-claims critical path (#478). No artifact
  # download, no CLAIMS_PARQUET.
  heavy-nonfold:
    name: heavy-nonfold
    needs: [matrix-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.matrix-setup.outputs.nonfolds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-duckdb
      - run: npx vitest run "$HEAVY_FILE" --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/nonfold-${JOB_INDEX}.json"
        env:
          HEAVY_FILE: ${{ matrix.file }}
          JOB_INDEX: ${{ strategy.job-index }}
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-nonfold-${{ strategy.job-index }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # Sharded heavy tests (#478). KEY POINT (the counter-intuitive bit): vitest
  # parallelises whole FILES across workers, NOT test-cases within a file, so this
  # is a CI-LEVEL data split, not a vitest feature - the matrix spawns N jobs and
  # the file reads RECON_SHARD="i/N" to process only its 1/N slice. N is tuned to
  # drop the file below the NEXT-slowest test, not to the source count. A rebuild
  # test - no Parquet, no build-claims wait. The (file, shard, total) combos come
  # from matrix-setup, derived from sharded-tests.json's declared shard counts.
  # Full rationale, mental model and how-to: src/testing/CI-SHARDING.md.
  heavy-shard:
    name: heavy-shard
    needs: [matrix-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.shardmatrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-duckdb
      - run: npx vitest run "$HEAVY_FILE" --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/shard-${JOB_INDEX}.json"
        env:
          HEAVY_FILE: ${{ matrix.file }}
          JOB_INDEX: ${{ strategy.job-index }}
          RECON_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-shard-${{ strategy.job-index }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The published SQLite tiers (combined DB + per-dataset DBs + union CSV) are built
  # and verified here in one dedicated, CACHED job rather than the generic
  # non-fold pool (#478). Its inputs - the committed archive, reference-data and
  # the builder closure - change on few PRs, so actions/cache restores the built
  # directory whenever that closure is unchanged (same key) and the test verifies
  # the RESTORED build instead of paying the rebuild; the build is deterministic
  # in the hashed inputs, so anything that could change the tiers also changes the
  # key. On a miss the test builds with compress:false - RAW databases + CSV, no
  # gzip - dropping the publish-only work (the combined download twin and the 45
  # per-dataset gzips, ~61% of the build) that no data assertion needs. No DuckDB
  # (node:sqlite only). NB the key is 'verify'-scoped because this raw build is a
  # DIFFERENT output from the deploy's compressed tiers, so it must NOT share this
  # cache. Per ADR 0019 the CI and deploy jobs now live together in this one
  # unified workflow, but their caches stay separate by key: this verify cache is
  # 'verify'-scoped (raw, uncompressed) and the deploy's build-site-databases job
  # packages its own tiers under a 'pages-db-*' key, so the two still never share
  # a cache.
  build-sqlite-tiers:
    name: build-sqlite-tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 'verify' = the raw (uncompressed) build this job consumes, distinct from the
      # deploy's compressed tiers (see the job comment). The key is the closure hash
      # with test files excluded (closure-hash action); .nvmrc is in the paths since
      # node's SQLite output can shift across versions without any hashed source
      # changing.
      - id: closure
        uses: ./.github/actions/closure-hash
        with:
          paths: archive reference-data src/ci/build-sqlite.ts src/shared src/sources package-lock.json .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tier-cache
          key: sqlite-tiers-verify-v2-${{ steps.closure.outputs.hash }}
      # TIERS_CACHE_DIR: the test builds here on a miss (the post-job save then
      # persists it) or verifies the restored build on a hit - see the reuse
      # contract in the test's beforeAll. --coverage + blob so the merged coverage
      # floor still counts this file; matrix-free (a fixed file), starts at t=0.
      - run: npx vitest run src/ci/build-sqlite.tiers.test.ts --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/tiers.json"
        env:
          TIERS_CACHE_DIR: ${{ github.workspace }}/.tier-cache
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-tiers
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The whole-archive raw-keyed claim ledger (issue #361 buildLedger) is built
  # and verified here in one dedicated, CACHED job rather than the generic
  # non-fold pool (#478). Its inputs - the committed archive, reference-data and
  # the emit-path source closure - change on few PRs, so actions/cache restores
  # the built ledger directory whenever that closure is unchanged (same key) and
  # the corpus-scale test verifies the RESTORED build instead of paying the full
  # rebuild (~395s, the file's dominant cost); buildLedger is deterministic in the
  # hashed inputs, so anything that could change the emitted ledger also changes
  # the key and forces a fresh build. No DuckDB: buildLedger emits JSONL straight
  # from the raw bytes (node only), so unlike the fold jobs it needs no CLI.
  build-ledger:
    name: build-ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The pinned DuckDB CLI (exports DUCKDB_BIN): the sole-emitter sweep in
      # build-ledger.test.ts reads the persisted per-source JSONL back through
      # DuckDB (issue #813, design 1a) - this job is the ONE place that JSONL
      # exists on disk, so the sweep must execute here rather than skip. The
      # action is deliberately NOT in the closure paths below: the cache key
      # gates whether the ledger is REBUILT, and DuckDB only reads the ledger
      # (fresh or restored) - it never shapes the cached bytes.
      - uses: ./.github/actions/setup-duckdb
      # The build-claims input closure minus the DuckDB action (see above: DuckDB
      # verifies, never produces): the committed data plus the emit-path source
      # tree. The key is the closure hash with test files excluded (closure-hash
      # action); .nvmrc is in the paths since a node bump can shift the emitted
      # bytes.
      - id: closure
        uses: ./.github/actions/closure-hash
        with:
          paths: archive reference-data src/v2 src/sources src/shared package-lock.json .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ledger-cache
          key: ledger-corpus-v2-${{ steps.closure.outputs.hash }}
      # LEDGER_CACHE_DIR: the corpus-scale test builds here on a miss (the post-job
      # save then persists it) or verifies the restored build on a hit - see the
      # reuse contract in the test's beforeAll. --coverage + blob so the merged
      # coverage floor still counts this file; matrix-free (a fixed file), t=0.
      - run: npx vitest run src/v2/build-ledger.test.ts --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/ledger.json"
        env:
          LEDGER_CACHE_DIR: ${{ github.workspace }}/.ledger-cache
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-ledger
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  fast:
    name: fast
    needs: build-claims
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-duckdb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claims-parquet
      # The ~78 trivial files (the fast project excludes the isolated heavy list),
      # sharded across 2 runners. Folds among them (e.g. cross-dataset-invariants)
      # read the shared Parquet too. --coverage + blob as above; merged in `coverage`.
      - run: npx vitest run --project fast --shard="${SHARD}/2" --coverage --reporter=default --reporter=blob --outputFile=".vitest-reports/fast-${SHARD}.json"
        env:
          SHARD: ${{ matrix.shard }}
          CLAIMS_PARQUET: ${{ github.workspace }}/claims.parquet
          # Collect coverage into the blob; the floor is applied at the merge, not
          # per-shard (a shard can't meet it alone).
          COVERAGE_SKIP_THRESHOLDS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-fast-${{ matrix.shard }}
          path: .vitest-reports/
          # See the heavy job: .vitest-reports is hidden, so include it explicitly.
          include-hidden-files: true
          retention-days: 1

  # Collate coverage across the fan-out (#478): download every job's blob and
  # merge them into one v8 report, applying the thresholds in vitest.config. This
  # keeps the coverage floor enforced PER-PR despite the tests being split across
  # jobs - the alternative (a nightly/main-only coverage run) was rejected since
  # the merge keeps the gate pre-merge. Fails iff merged coverage is below floor.
  coverage:
    name: coverage
    needs: [heavy-fold, heavy-nonfold, heavy-shard, build-sqlite-tiers, build-ledger, fast]
    # Runs on red too (skipped only on cancellation): the merged report and the
    # run summary are MOST needed when a shard failed, and the blob uploads now
    # survive failure. On a red run the merge covers the shards that completed;
    # the run-level conclusion is already red via the tests aggregator, and the
    # baseline fetch only ever reads SUCCESSFUL runs, so a partial merge can
    # neither go green nor pollute later comparisons.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest-reports
      - run: npx vitest --merge-reports --coverage --reporter=default --reporter=json --outputFile=.vitest-reports/merged-results.json --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=json
      # Fetch the latest successful main run's baseline artefact (read-only,
      # default token) so the summary shows DELTAS vs main — the change is the
      # interesting figure, not the raw number. Best-effort: a missing baseline
      # renders an explicit "no baseline" line, never a failure.
      - name: Fetch comparison baseline
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci-baseline
          run_id="$(gh run list --workflow cicd.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name ci-summary-baseline --dir .ci-baseline || echo "baseline artefact unavailable for run $run_id"
          else
            echo "no successful main run found for baseline"
          fi
      # Meta-reporting only: renders totals, failure names and merged coverage
      # onto the run summary page. Runs even when the merge step failed so a
      # red run still shows WHICH tests failed at a glance; never gates.
      - name: Write run summary
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types src/ci/ci-summary.ts >> "$GITHUB_STEP_SUMMARY"
      # This run's own headline figures, uploaded for future runs to diff
      # against (the fetch step above reads the latest MAIN run's copy).
      # Best-effort: no merged results means no baseline to record.
      - name: Write comparison baseline
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types src/ci/ci-summary.ts --write-baseline baseline.json || echo "no baseline written (merged results unavailable)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-summary-baseline
          path: baseline.json
          retention-days: 90
          if-no-files-found: ignore
      # Full-fidelity companion to the curated baseline: the complete merged
      # vitest results (every test, status, duration, failure detail) and both
      # coverage reports including the line-level istanbul data. Kept so later
      # analysis is never limited to what the baseline chose to curate.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-run-full-results
          path: |
            .vitest-reports/merged-results.json
            coverage/coverage-summary.json
            coverage/coverage-final.json
          retention-days: 90
          if-no-files-found: ignore

  # Aggregator gate: the single required `tests` check branch protection needs.
  # The suite is fanned out across typecheck / build-claims / heavy / fast (#478),
  # so this job passes iff every one of them passed - one status to require
  # instead of listing each matrix leg in the ruleset. `if: always()` so it still
  # runs (and fails) when an upstream job fails rather than being skipped, which
  # branch protection would otherwise treat as a pass.
  tests:
    name: tests
    needs: [typecheck, build-claims, matrix-setup, heavy-fold, heavy-nonfold, heavy-shard, build-sqlite-tiers, build-ledger, fast, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fails iff any needed job failed or was cancelled. The step is skipped when
      # they all passed, so the job succeeds - single-quoted string literals as
      # GitHub expression syntax requires.
      - name: Require every fan-out job to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a fan-out test job did not pass"
          exit 1

  # Workflow hygiene auditors. Not required status checks (they gate the
  # workflows, not the data), but red runs demand attention:
  # - actionlint: syntax + shellcheck on the bash embedded in run: blocks -
  #   the security-critical orchestration (data-sweep, reports-sweep) lives there.
  # - zizmor: security audit of workflow patterns (pwn-requests, credential
  #   handling, unpinned actions).
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # v1.7.12
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipx is a documented component of the ubuntu-latest runner image;
          # no install-fallback branch - it would be dead code that bitrots,
          # and if pipx ever disappears from the image a loud failure here is
          # the correct outcome, not a silent switch of install mechanism.
          pipx run zizmor==1.26.1 --format plain .github/workflows/

  data-validation:
    name: data-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate archive entries and latest-* pointers
        run: |
          set -euo pipefail
          # Structural + byte-integrity checks run over ALL archive entries;
          # expensive deep CSV parsing runs only on entries this PR touches
          # (or the newest entry, on pushes to main).
          # Deliberately NO BUILDER_PROJECTION_DIR here (issue #629): this job
          # validates the COMMITTED record a data PR merges - the raw/meta
          # bytes and the frozen derived baseline under archive/ - so its
          # derived-file reads stay on the archive. The projection-side twin
          # of the frozen baseline is separately gated by the full-corpus
          # parity suite; #448 owns any re-home of the validators.
          keys=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            keys="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- 'archive/' | cut -d/ -f2 | sort -u)"
          fi
          # shellcheck disable=SC2086 # archive keys are date-shaped, never contain spaces
          node src/ci/validate-data.ts $keys

  # Golden-master freshness (issue #243). The value catalogue and standing
  # reports under reports/ are committed golden masters, regenerated and
  # committed by the SCHEDULED report sweep (reports-sweep.yml). Nothing
  # otherwise stops a PR from changing generation logic - or hand-editing a
  # report - and committing a stale copy while CI stays green: the "PR diff is
  # the drift signal" contract would then hold only on the schedule, never
  # per-PR. This job re-runs the same generators (no network, no SQLite build),
  # feeding the report lane's derived-file reads from the ledger projection
  # (issue #629 - see the regeneration step), and fails if the working tree
  # then differs from what is committed, so a stale golden master is caught on
  # the PR that introduced it. The assertion is scoped to reports/ - the only
  # tree the report lane writes (#446 froze the committed archive derivatives).
  #
  # CACHED regeneration (#478): the sweep is the job's whole cost, and its output
  # is a pure function of its input closure - the committed archive/ +
  # reference-data/ and the sweep + fold code (src/ci, and the ledger folds it
  # calls under src/v2, plus src/shared / src/sources). actions/cache stores the
  # regenerated reports keyed by exactly that closure; on a hit the (byte-
  # identical) regeneration is restored instead of recomputed. Crucially the
  # committed reports are NOT part of the key, so the drift gate stays honest: the
  # git diff always compares the committed tree against a fresh-or-restored
  # regeneration, and a stale or hand-edited committed report still diffs and
  # fails. A hit means "regeneration for this closure would be byte-identical", so
  # restoring it and diffing catches drift exactly as a fresh sweep would.
  #
  # Required-check candidate (#588 part 2). This job is not yet in the main
  # ruleset's required-status-checks list (ADR 0002), so a red golden-master
  # run does not by itself hold open a PR that `tests` + `data-validation`
  # already pass - including an auto-merged data-only PR. It is a single job
  # with no `strategy:` matrix, so it reports one stable context: the exact
  # string "golden-master" (guarded by the cicd-workflow-structure suite).
  # Adding that string to the ruleset's required-status-checks set (Settings ->
  # Rules -> Rulesets -> "main: pull requests only" -> Require status checks
  # to pass -> add checks -> "golden-master") is the activation step; record
  # it in ADR 0002 alongside `tests` and `data-validation` once added.
  golden-master:
    name: golden-master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The closure hash with test files excluded (closure-hash action): the
      # regeneration is a pure function of the committed data + the sweep/fold code,
      # so a src/ci test edit no longer reruns the sweep - the drift check still runs
      # against the restored reports, so the gate stays honest either way. The DuckDB
      # action is in the paths because the sweep folds the cross-dataset invariants
      # (and quality reports) through it, so a CLI change shifts the regenerated bytes.
      - id: closure
        uses: ./.github/actions/closure-hash
        with:
          paths: archive reference-data src/ci src/v2 src/shared src/sources package-lock.json .nvmrc .github/actions/setup-duckdb/action.yml
      - id: reports-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # A side directory holds the regeneration snapshot; the committed
          # reports/ working tree is left untouched until the drift check overlays
          # this onto it.
          path: .golden-cache/reports
          key: golden-reports-v2-${{ steps.closure.outputs.hash }}
      # The cross-dataset-invariants report is folded via DuckDB, so a MISS - which
      # reruns the sweep - needs the pinned CLI to reproduce it (issue #361). A hit
      # restores the regeneration and never invokes the sweep, so it needs no CLI.
      - if: steps.reports-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-duckdb
      - name: Regenerate reports (cache miss) and snapshot for the cache
        if: steps.reports-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Golden regeneration flows FROM THE LEDGER PROJECTION (issue #629):
          # the report lane's derived-file reads (per-entry stats, components,
          # the register the invariants fold) resolve into the projection
          # built here - the SAME input path the scheduled report sweep runs,
          # so this gate proves pre-merge exactly what the schedule will do.
          # For the frozen committed baseline the projection is byte-identical
          # to the committed files (the parity gate), and a publication newer
          # than the baseline exists only in the projection - reading it here
          # is what keeps this drift gate honest the day one lands.
          node src/v2/build-builder-projection.ts "$RUNNER_TEMP/builder-projection"
          mkdir -p .perf-reports
          PERF=1 PERF_JSON=.perf-reports/report-sweep.json BUILDER_PROJECTION_DIR="$RUNNER_TEMP/builder-projection" npm run reports:sweep
          rm -rf .golden-cache/reports
          mkdir -p .golden-cache
          cp -r reports .golden-cache/reports
      # Same phase-timing history for the report sweep (#354); regeneration
      # is cache-gated, so absence on a run means "not regenerated".
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-reports-golden-master
          path: .perf-reports/
          retention-days: 90
          if-no-files-found: ignore
      - name: Restore cached regeneration (cache hit)
        if: steps.reports-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          # Overlay the restored regeneration onto the committed working tree, so
          # the drift check below compares committed against a regeneration exactly
          # as it would after a fresh sweep.
          rm -rf reports
          cp -r .golden-cache/reports reports
      - name: Check golden-master drift
        id: golden-drift
        run: |
          set -euo pipefail
          # Byte-identical regeneration leaves the tree clean; any difference means
          # a committed report is stale (or was hand-edited). Same assertion on hit
          # and miss - the cache only changes HOW the regeneration was produced,
          # never WHAT it is compared against. On drift the regenerated reports/ are
          # the working-tree copy here, so the next step uploads them as an artifact
          # for a follow-up commit to land BEFORE this job fails: CI surfaces the
          # fresh goldens and the verify pipeline never writes to the repo itself
          # (ADR 0012 read-only posture; issue #581).
          if ! git diff --quiet -- reports/; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "::error::Committed golden-master reports under reports/ are stale. The regenerated reports are attached as the 'regenerated-goldens' artifact - download it ('gh run download --name regenerated-goldens') and commit it over reports/, or regenerate locally with 'npm run setup:duckdb' then 'node src/ci/report-sweep.ts --build-projection'. Drift below:"
            git --no-pager diff -- reports/
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "Golden-master reports under reports/ are up to date."
          fi
      - name: Surface regenerated goldens for the follow-up commit (drift only)
        if: steps.golden-drift.outputs.drifted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-goldens
          path: reports/
          if-no-files-found: error
      - name: Fail on golden-master drift
        if: steps.golden-drift.outputs.drifted == 'true'
        run: |
          echo "::error::Golden-master drift - regenerated reports/ uploaded as the 'regenerated-goldens' artifact; land them in the PR (see the 'Check golden-master drift' step for the diff)."
          exit 1

  # GitHub Pages deploy build (ADR 0003): builds the published SQLite databases
  # and assembles the static lookup site as a DEPLOY ARTEFACT. It runs on ALL
  # triggers (no branch gate on the job) so a PR builds and assembles _site to
  # validate the deploy path - the pre-merge coverage ADR 0019 adds - but the
  # configure/upload Pages steps at the end are gated to main, so a PR does not
  # upload an artefact and only the push-to-main run feeds the deploy job.
  #
  # The databases are deliberately never committed - SQLite files are not
  # byte-deterministic, so they live outside the golden-master lane and are
  # derived fresh from committed data (archive/ + reference-data/) each build.
  build-site-databases:
    runs-on: ubuntu-latest
    steps:
      # Reclaim runner disk before anything writes: the packaged databases plus
      # the archive (now including copies held in full) leave little headroom on
      # the default image, and the assembly has failed with ENOSPC. Delete the
      # large preinstalled toolchains this job never uses; each path is guarded
      # (|| true) so a future image that drops one is not a failure, and setup-node
      # below reinstalls Node into the tool cache after it is cleared. df -h is
      # echoed before and after so any recurrence is diagnosable from the log.
      - name: Free runner disk space
        run: |
          echo "== disk before =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "== disk after =="; df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The published anomaly-observation note (issue #467's residual, the
      # Assemble-the-site step's build-data-status.ts call below) folds the
      # per-status distribution signal through DuckDB (dataset-anomaly-flags.ts's
      # foldStatusShares). Its record-count signal needs no engine and degrades
      # gracefully without it, but installing the pinned CLI here (cheap: a single
      # small static binary) lets every signal the detector computes run in the
      # published build, not just the DuckDB-independent one.
      - uses: ./.github/actions/setup-duckdb
      # The published databases are a pure function of the committed data plus the
      # builder sources, so restore them from a content-addressed cache keyed on
      # that input closure (mirroring the build-sqlite-tiers/build-ledger verify
      # caches above, and the same actions/cache pin). A deploy that changes only
      # the site (HTML/JS/CSS) then restores the ~1 GB combined and the full ledger
      # fold in seconds instead of rebuilding them (~24 min). SQLite is not byte-
      # deterministic, but any build of the same inputs is equivalent, and each
      # deploy serves one internally-consistent set under its own ?v= stamp, so a
      # restored build is as correct as a fresh one. A change to the data or the
      # builders rekeys the cache and rebuilds. .dbstage carries the FINAL packaged
      # artefacts (gzipped, and the ledger already split into chunks), so a hit
      # skips the compression and chunking too.
      - id: closure
        uses: ./.github/actions/closure-hash
        with:
          paths: archive reference-data src/ci/build-sqlite.ts src/v2 src/shared src/sources package-lock.json .nvmrc
      - name: Restore built databases
        id: db-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Two staged outputs share the one closure-keyed cache: the packaged
          # databases (.dbstage, hardlinked into _site/data) and the builder
          # projection (.builder-projection, the per-entry derived files the
          # assemble step's builders read - issue #629 phase 2; deliberately a
          # SIBLING of .dbstage so it never rides the _site/data publish).
          # Both are pure functions of the same hashed closure.
          path: |
            .dbstage
            .builder-projection
          # Closure hash with test files excluded (closure-hash action), so a
          # test-only edit no longer forces a full ~22 min database rebuild.
          # v3: the cached shape gained .builder-projection - the bump stops an
          # older .dbstage-only cache restoring WITHOUT the projection, which
          # would fail the assemble step loudly (correct, but avoidably).
          key: pages-db-v3-${{ steps.closure.outputs.hash }}
      - name: Build databases
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          # The ledger Stage-1 emit is the step's memory-bound phase (~4 GB RSS
          # measured, #533) and V8's default old-space cap sits near it; give
          # the whole-corpus emit explicit headroom on the 16 GB runner so it
          # never thrashes the garbage collector against the default ceiling.
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          mkdir -p .dbstage .perf-reports
          # The raw-keyed claim-ledger database (issue #361, Stage 3a): the deploy
          # artefact the Ledger page queries in the browser over the same range-
          # request VFS, in the same .png costume. The COMPACT build (#368) folds
          # the FULL corpus into a range-served SQLite by splitting provenance onto
          # an observation row and reconstructing the derived layer through a
          # `claims` VIEW. Never committed (SQLite is not byte-deterministic).
          # --no-gz-twin: chunked serving (below, #475) replaced the gzipped
          # download twin on this path, so the deploy skips the level-9 gzip
          # of the multi-GB database it previously built and then deleted.
          # --ledger-dir keeps the Stage-1 JSONL emit so the projection builds
          # below fold the SAME emit instead of paying for a second one.
          PERF=1 PERF_JSON=.perf-reports/build-ledger-db-compact.json node src/v2/build-ledger-db-compact.ts .dbstage/claim-ledger.sqlite.png --no-gz-twin --ledger-dir="$RUNNER_TEMP/v2-ledger-emit"
          # The ledger-derived surface projection databases (issue #572): the
          # lookup and history databases the interactive surfaces (app.js,
          # compare.js, entry-browser.js, explore.js) query over the same
          # range-request VFS, folded from the claim ledger emitted above.
          # These are the only runtime databases the surfaces load: the
          # build-sqlite.ts step below builds the download tiers alone, not a
          # parallel runtime pair (the legacy runtime pair is retired, #445).
          node src/v2/build-projection-db.ts .dbstage/ledger-lookup.sqlite.png .dbstage/ledger-history.sqlite.png --ledger-dir="$RUNNER_TEMP/v2-ledger-emit"
          # The builder-facing projection (issue #629 phase 2): the per-entry
          # normalised.csv/components.csv/stats.json the assemble step's
          # builders read (BUILDER_PROJECTION_DIR below), folded from the SAME
          # shared emit and proven byte-identical to the committed files by the
          # full-corpus parity gate (builder-projection-parity.test.ts). Built
          # into a sibling of .dbstage so it is cached alongside the databases
          # but never hardlinked into _site/data. ~40 s and ~117 MB on top of
          # the shared emit (the phase-1 measurements).
          node src/v2/build-builder-projection.ts .builder-projection --ledger-dir="$RUNNER_TEMP/v2-ledger-emit"
          # Peak-flattening (issue #646): the Stage-1 JSONL emit was kept
          # (--ledger-dir) only so the projection builds fold the SAME emit the
          # compact-ledger build did, rather than re-emitting the corpus. The
          # builder projection above is its LAST consumer, so drop it here -
          # its high-water share (the whole-corpus emit) is freed before the
          # remaining stages and the site assembly write. The compact-ledger,
          # surface-projection and builder-projection builders are the only
          # readers; the download tiers below read the builder PROJECTION, not
          # the emit, and the raw-verification tiers oracle (a separate job)
          # emits its own, so nothing downstream in this job needs it.
          rm -rf "$RUNNER_TEMP/v2-ledger-emit"
          # The published DOWNLOAD data tiers (#149): the gzipped flat union CSV,
          # one gzipped SQLite per archive entry, and the combined database's
          # gzipped download twin. The interactive surfaces read the ledger
          # projection databases built above (#572), so the legacy runtime pair
          # (callsigns.sqlite.png, combined.sqlite.png) is retired (#445): the
          # combined database is built only as the twin's intermediate and removed
          # before it reaches the deploy. Runs AFTER the builder projection with
          # the switch set (issue #629 phase 3), so the tiers' derived-file
          # inputs resolve to the projection - byte-identical to the committed
          # files by the parity gate, and covering a publication newer than the
          # frozen committed baseline the moment it lands.
          PERF=1 PERF_JSON=.perf-reports/build-sqlite.json BUILDER_PROJECTION_DIR="$GITHUB_WORKSPACE/.builder-projection" node src/ci/build-sqlite.ts .dbstage
          # Serve the ledger CHUNKED, not as one file (issue #475). A HEAD of a
          # large object on Pages negotiates a compressed variant that is a
          # persistent CDN cache MISS, stalling the in-browser open ~30s. Chunked
          # mode takes the length from a manifest (no HEAD) and range-reads WITHIN
          # fixed-size chunk files. 90 MiB keeps each part under the Pages 100 MB
          # per-file limit (~16 parts; a `cat …png.* > db` reassembles it).
          server_chunk=94371840   # 90 MiB, a multiple of the 4096 page size
          db_len=$(stat -c%s .dbstage/claim-ledger.sqlite.png)
          split -b "$server_chunk" -d -a 3 .dbstage/claim-ledger.sqlite.png .dbstage/claim-ledger.sqlite.png.
          printf '{"databaseLengthBytes":%s,"serverChunkSize":%s,"suffixLength":3}\n' "$db_len" "$server_chunk" > .dbstage/claim-ledger.chunks.json
          # Drop the monolith (the query lane reads the chunks), so the cache
          # and the site carry the chunks only, not both.
          rm -f .dbstage/claim-ledger.sqlite.png
      - name: Assemble the site
        env:
          # The page builders read every derived per-entry file (normalised.csv,
          # components.csv, stats.json) from the ledger projection built/restored
          # above (issue #629 phase 2), exactly as the download-tier build in the
          # database step does (phase 3). The switch is explicit: a missing
          # projection fails this step loudly rather than silently reading the
          # committed archive. meta.json and the raw files stay archive reads.
          BUILDER_PROJECTION_DIR: ${{ github.workspace }}/.builder-projection
        run: |
          mkdir -p _site/data _site/vendor .perf-reports
          # Publish the built databases - restored from the cache above, or freshly
          # built on a miss. -l HARDLINKS instead of copying: .dbstage and _site
          # share one filesystem, so the multi-GB databases are named twice, not
          # duplicated on disk (issue #646). Nothing rewrites these files in place
          # afterwards - build-db-sizes.ts only reads them, and version.txt is a
          # fresh separate file - so the shared inodes are safe and the .dbstage
          # the cache re-saves is unchanged. -a preserves the datasets/ subtree
          # and the chunks.
          cp -al .dbstage/. _site/data/
          # Version stamp: the app appends ?v=<sha> to the database URL so each
          # deploy is a distinct CDN cache object - two deploys inside the Pages
          # max-age window otherwise mix range chunks from different database
          # versions (observed live: "database disk image is malformed"). Written
          # fresh each deploy, so it is deliberately NOT part of the cached .dbstage.
          printf '%s' "$GITHUB_SHA" > _site/data/version.txt
          # Deploy provenance for page footers: the commit's own timestamp and this
          # build's time (the run id/number/url come from the standard GITHUB_* env
          # vars the generator reads). Declare then export separately so the
          # command's exit status isn't masked by the export (shellcheck SC2155).
          BUILD_COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_COMMIT_TIME BUILD_TIME
          # Dataset index (issue #149 item 3): per-entry pages publishing the
          # archived files verbatim at stable URLs + Frictionless descriptors +
          # sitemap.xml - the Wayback Machine crawl seed.
          PERF=1 PERF_JSON=.perf-reports/build-dataset-pages.json node src/ci/build-dataset-pages.ts _site
          # Copy every hand-authored site asset by glob rather than a hand-listed
          # set: a module added later (and imported by app.js et al) is deployed
          # automatically, so a missing import can no longer break the live pages.
          # The site-deploy-coverage test guards this contract.
          cp site/*.html site/*.js site/*.css site/*.webmanifest _site/
          # Stamp the real, current database sizes into the [[db-size:*]]
          # placeholders the size labels carry (issue #499), so they never drift as
          # the databases grow - the combined database was labelled "257 MB" long
          # after it passed 1 GB. Reads the published databases; fails loudly if one
          # is missing.
          node src/ci/build-db-sizes.ts _site
          # Version-stamp the service worker (ADR 0008). The browser re-installs a
          # worker only when its script bytes change, so writing the commit SHA into
          # DEPLOY_VERSION makes each deploy supersede the last. Same rationale as
          # the database ?v= stamp above.
          sed -i "s/const DEPLOY_VERSION = 'dev';/const DEPLOY_VERSION = '$GITHUB_SHA';/" _site/sw.js
          # The statistics page's aggregates (locator matrix, flags table) are
          # deterministic per deploy - pre-rendered so the page is fully static.
          node src/ci/build-home-aggregates.ts _site/statistics.html
          # The home page's build-time surfaces (issue #712): the corpus-wide
          # holdings map (every dataset, one lettered cell deep-linking to its
          # page) and the headline figures, pre-rendered from the committed
          # archive so the front door works with JavaScript off. Runs after the
          # site copy above (which lands index.html in _site) and after
          # build-dataset-pages, which builds the dataset pages the map links to.
          node src/ci/build-front-door.ts _site/index.html
          # The /data-status coverage tracker (issue #376): the dataset ×
          # processing-stage grid, per-type rollup, known-but-absent work-queue and
          # series/gap view - all derived here from the committed archive and the
          # source register, never hand-maintained.
          node src/ci/build-data-status.ts _site/data-status.html
          # The instant per-callsign page's data (issue #594): prefix-sharded
          # static JSON + the datasets.json manifest, a deterministic projection
          # of the same archived publications the databases fold. Built fresh
          # each deploy (fast, byte-deterministic) rather than riding the
          # .dbstage cache, whose key does not cover this builder.
          node src/ci/build-callsign-shards.ts _site/callsign/data
          # The event-time surfaces (issue #726): the per-callsign event
          # strip's sharded JSON (+ meta) under _site/callsign/data/events/
          # and the on-this-day calendar page - one pass over the same
          # canonical inputs, run through the S1 event-date emit path
          # in-process (the claim ledger stays the deep-provenance surface).
          node src/ci/build-event-time-surfaces.ts _site
          # The About page's licensing/provenance acknowledgement (issue #560)
          # is derived from the publisher register at build time - one line
          # per publisher, so it cannot drift out of step with
          # reference-data/publishers.json. Runs after build-dataset-pages
          # above, which is what builds the publisher pages this links to.
          node src/ci/build-about-acknowledgement.ts _site/about.html
          # Stamp the canonical nav strip (the single source, navHtml in
          # site-render.ts) into every hand-authored page (issue #308).
          node src/ci/build-nav.ts _site/index.html _site/statistics.html _site/explore.html _site/compare.html _site/ledger.html _site/callsign.html _site/playground.html _site/data-status.html _site/glossary.html _site/about.html
          # sql.js-httpvfs is served from the npm-audited package, vendored at build
          # time - no CDN scripts, nothing committed. The sourcemap is included so
          # browser devtools stop 404ing for it.
          cp node_modules/sql.js-httpvfs/dist/index.js \
             node_modules/sql.js-httpvfs/dist/index.js.map \
             node_modules/sql.js-httpvfs/dist/sqlite.worker.js \
             node_modules/sql.js-httpvfs/dist/sql-wasm.wasm \
             _site/vendor/
          # Stamp the service-worker precache manifest (issue #614). Enumerates
          # the shipped static shell by the same rule the deploy-coverage guard
          # enforces and injects it into sw.js's SHELL_ASSETS, plus a content-hash
          # SHELL_VERSION that busts the shell cache exactly when the precached
          # set or any precached file changes - so no lane hand-edits sw.js.
          # Runs LAST, after every asset (incl. vendored library and the nav/
          # db-size/aggregate-stamped pages) is in place, so the hash covers the
          # final deployed bytes.
          node src/ci/build-sw-precache.ts _site/sw.js
      # Pages upload is a deploy-only concern: gated to main so a PR builds and
      # assembles _site (the pre-merge coverage) but never uploads an artefact.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # Phase-timing history for the optimisation work (#354): coarse per-
      # phase reports from the instrumented builders, recorded on every run
      # that actually built (cache-hit runs produce only the assemble-step
      # report - absence of the others means "not rebuilt", not zero).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-reports-site-build
          path: .perf-reports/
          retention-days: 90
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-site-databases
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Post-deploy smoke test (issue #497): light liveness + integrity checks against
  # the LIVE deployment. It confirms the deploy succeeded and shipped correct,
  # correctly-PACKAGED bytes - the version stamp actually superseded the previous
  # deploy, and the gzipped artefacts are genuinely compressed (not an uncompressed
  # file under a .gz name). Those publish concerns are exactly what the per-PR
  # suite stopped checking when the tier verification went to a raw build (#496),
  # so this is where they land. It runs AFTER deploy (no repo writes, no npm deps -
  # the script uses only built-in fetch), reports every failing check, and fails
  # the run on a bad deployment. Checks + rationale: src/ci/smoke-test.ts.
  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # GITHUB_SHA is set by the runner; the script compares it to the deployed
      # data/version.txt and the generated-page footer.
      - run: node src/ci/smoke-test.ts "$PAGES_URL"
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}

  # Post-deploy browser-console check (issue #497 follow-up): loads a selection of
  # pages in headless Chromium (Playwright) against the LIVE deployment and fails
  # on console errors/warnings, uncaught page errors, or failed requests - the
  # runtime faults (broken imports, CSP violations, missing assets, database load
  # failures) a fetch-only smoke test cannot see. The allow list in the script is
  # calibrated against the live site (one documented HEAD/gzip exception, #475), so
  # it asserts zero UNEXPECTED console output. Separate from smoke because it needs
  # a browser; post-deploy, no repo writes. Chromium is installed explicitly:
  # ignore-scripts=true (ADR 0002) stops Playwright's postinstall auto-downloading
  # it, so the fetch is a deliberate, visible step.
  console-check:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/ci/console-check.ts "$PAGES_URL"
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}

  # Post-deploy functionality check (issue #497 follow-up): drives the PRIMARY
  # interaction on each dynamic page in headless Chromium and verifies, content-
  # agnostically, that the click/submit handler fires (an immediate progress
  # indicator appears), it transitions to a rendered result (some data shows), and
  # nothing errors in the console meanwhile. It does not assert WHAT renders, only
  # that a working flow produced output, so it stays robust as the data changes -
  # the interaction counterpart to console-check (pages load clean) and smoke-test
  # (bytes are served). Same browser install rationale as console-check.
  functionality-check:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/ci/functionality-check.ts "$PAGES_URL"
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
