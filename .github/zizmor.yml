# zizmor configuration (run by the workflow-audit CI job).
rules:
  artipacked:
    # persist-credentials: false is set everywhere third-party code runs
    # (ci.yml, and normalise.yml which injects its token only at the push
    # step). data-sweep is the one deliberate exception: it runs ONLY git and
    # gh (no npm ci, no third-party code), and pushing/merging is its entire
    # purpose - see ADR 0002 for the write posture it operates under.
    ignore:
      - data-sweep.yml
